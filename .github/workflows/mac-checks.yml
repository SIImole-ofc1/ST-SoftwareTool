name: Mac feature checks

# Fast checks of the macOS-specific Task Manager and Advanced Startup code on real Macs
# (no Nuitka build). Saves screenshots of those tabs as an artifact.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'core/**'
      - 'ui/**'
      - 'main.py'
      - 'tests/mac/**'
      - '.github/workflows/mac-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install "PySide6==6.8.*" psutil
      - name: Task Manager and Advanced Startup checks
        run: python tests/mac/check_mac_features.py

      - name: Screenshots of every tab (Task Manager, Advanced Startup, ...)
        if: always()
        run: ST_SMOKE_TEST=8 ST_SMOKE_SHOTS=build/shots python main.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-tab-screenshots
          path: build/shots/
          if-no-files-found: ignore
          retention-days: 14
