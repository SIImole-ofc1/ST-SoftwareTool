name: Mac feature checks

# Fast checks of the macOS-specific Task Manager and Advanced Startup code on real Macs
# (no Nuitka build). Saves screenshots of those tabs as an artifact.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'core/**'
      - 'ui/**'
      - 'main.py'
      - 'tests/mac/**'
      - 'scripts/fetch-tor-macos.sh'
      - '.github/workflows/mac-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install "PySide6==6.8.*" psutil certifi
      - name: Download Tor for macOS (signature verified)
        run: bash scripts/fetch-tor-macos.sh arm64 core/tor_bundle

      - name: Task Manager, Advanced Startup and VPN checks
        run: python tests/mac/check_mac_features.py

      - name: Screenshots of every tab (Task Manager, Advanced Startup, ...)
        if: always()
        run: >-
          ST_SMOKE_TEST=14 ST_SMOKE_SHOTS=build/shots ST_SMOKE_WIDGET=1
          ST_SMOKE_ICON=dark ST_SMOKE_ICON_SHOT=build/shots/dock-dark-icon.png python main.py

      - name: Screenshots in the macOS Glass theme (window and desktop widget)
        if: always()
        run: >-
          ST_SMOKE_TEST=14 ST_SMOKE_SHOTS=build/shots/glass ST_SMOKE_WIDGET=1
          ST_SMOKE_THEME=glass python main.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-tab-screenshots
          path: build/shots/
          if-no-files-found: ignore
          retention-days: 14
