name: Build Windows installer

# Builds ST-SoftwareTool-Setup.exe the same way release.ps1 does (Nuitka + Inno Setup), installs
# it on the runner and smoke-tests the installed app. With "upload", the tested installer is
# attached to the release (replacing one already there). Nothing is uploaded if a step fails.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.0.29 (or a branch, e.g. main, for a test build without upload)'
        required: true
      upload:
        description: 'Attach the tested installer to that release'
        type: boolean
        default: false

permissions:
  contents: write          # attach the installer to the release

concurrency:
  group: windows-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag }}   # via env, never pasted into a script
      UPLOAD: ${{ inputs.upload }}
    steps:
      - name: Check the tag
        shell: bash
        run: |
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "IS_RELEASE=1" >> "$GITHUB_ENV"
          elif [[ "$UPLOAD" != "true" && "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Test build of '$TAG' (no upload)"
          else
            echo "::error::'$TAG' is not a plain release tag like v1.0.29 (uploads need one)"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Build scripts come from this workflow's own commit (they may be newer than the tag)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-tools
          sparse-checkout: scripts

      - name: Check the app version matches the tag
        if: env.IS_RELEASE == '1'
        shell: bash
        run: |
          app=$(grep -oE 'APP_VERSION = "[^"]+"' core/updater.py | cut -d'"' -f2)
          iss=$(grep -oE '#define AppVersion +"[^"]+"' ST-Setup.iss | cut -d'"' -f2)
          echo "tag=$TAG app=$app installer=$iss"
          [ "v$app" = "$TAG" ] && [ "v$iss" = "$TAG" ] || { echo "::error::version mismatch"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install "PySide6==6.8.*" psutil nuitka ordered-set zstandard

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Download Tor for Windows (signature verified)
        shell: bash
        run: bash ci-tools/scripts/fetch-tor-windows.sh core/tor_bundle

      - name: Compile app with Nuitka (as release.ps1)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --windows-icon-from-ico=assets/STsoftwareterminalLOGO.ico `
            --include-data-dir=assets=assets `
            --include-data-dir=core/tor_bundle=core/tor_bundle `
            --include-data-dir=tools=tools `
            --output-dir=dist_nuitka `
            --output-filename=ST.exe `
            --assume-yes-for-downloads `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka main build failed ($LASTEXITCODE)" }

          # proc_monitor: psutil runs here so the main process stays GIL-free
          python -m nuitka `
            --standalone `
            --windows-console-mode=attach `
            --output-dir=dist_nuitka\proc_monitor_build `
            --output-filename=proc_monitor.exe `
            --assume-yes-for-downloads `
            core\proc_monitor.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka proc_monitor build failed ($LASTEXITCODE)" }
          Copy-Item "dist_nuitka\proc_monitor_build\proc_monitor.dist\proc_monitor.exe" `
                    "dist_nuitka\main.dist\proc_monitor.exe" -Force

          # Nuitka skips .exe / .dll files in data dirs: copy the whole Tor bundle in
          Remove-Item "dist_nuitka\main.dist\core\tor_bundle" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "dist_nuitka\main.dist\core" | Out-Null
          Copy-Item "core\tor_bundle" "dist_nuitka\main.dist\core\" -Recurse -Force
          Get-ChildItem dist_nuitka\main.dist | Select-Object -First 30 Name

      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ST-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          Get-Item dist_nuitka\installer\ST-SoftwareTool-Setup.exe | Format-List Name, Length

      - name: Install it and smoke-test the installed app
        shell: pwsh
        run: |
          $setup = Start-Process dist_nuitka\installer\ST-SoftwareTool-Setup.exe `
                     -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru
          if (-not $setup.WaitForExit(600000)) { throw "Installer did not finish" }
          if ($setup.ExitCode -ne 0) { throw "Installer exit code $($setup.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'ST-SoftwareTool\ST.exe'
          if (-not (Test-Path $exe)) { throw "ST.exe not installed at $exe" }
          foreach ($f in 'proc_monitor.exe', 'core\tor_bundle\tor\tor.exe') {
            if (-not (Test-Path (Join-Path (Split-Path $exe) $f))) { throw "Missing $f" }
          }
          # Open every tab, run the Tor and HTTPS update checks, screenshot each tab
          $env:ST_SMOKE_TEST  = '20'
          $env:ST_SMOKE_SHOTS = "$PWD\build\shots"
          $env:ST_SMOKE_TOR   = '1'
          $env:ST_SMOKE_HTTPS = '1'
          $app = Start-Process $exe -PassThru
          if (-not $app.WaitForExit(600000)) { $app.Kill(); throw "App smoke test timed out" }
          Write-Host "App smoke test exit code: $($app.ExitCode)"
          if ($app.ExitCode -ne 0) { throw "App smoke test failed (exit $($app.ExitCode))" }
          # The glass theme too (solid backdrop on Windows)
          $env:ST_SMOKE_SHOTS = "$PWD\build\shots\glass"
          $env:ST_SMOKE_THEME = 'glass'
          Remove-Item Env:ST_SMOKE_TOR, Env:ST_SMOKE_HTTPS
          $app = Start-Process $exe -PassThru
          if (-not $app.WaitForExit(600000)) { $app.Kill(); throw "Glass smoke test timed out" }
          if ($app.ExitCode -ne 0) { throw "Glass smoke test failed (exit $($app.ExitCode))" }

      - name: Terminal shell, then Settings › Delete ST-SoftwareTool
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'ST-SoftwareTool'
          $data = Join-Path $env:APPDATA 'ST-SoftwareTool'
          $env:ST_SMOKE_TEST = '15'; $env:ST_SMOKE_SHELL = '1'; $env:ST_SMOKE_UNINSTALL = '1'
          $env:ST_SMOKE_LOG = "$env:RUNNER_TEMP\delete-test.log"
          $app = Start-Process (Join-Path $dir 'ST.exe') -PassThru
          if (-not $app.WaitForExit(300000)) { $app.Kill(); throw "Delete test timed out" }
          Write-Host "App exit code: $($app.ExitCode)"
          if (Test-Path $env:ST_SMOKE_LOG) { Get-Content $env:ST_SMOKE_LOG | Where-Object { $_ -match 'SMOKE|Error|Traceback|line' } }
          Select-String -Path $env:ST_SMOKE_LOG -Pattern 'SMOKE shell=.* ok=True' -Quiet | Out-Null
          if ($app.ExitCode -ne 0) { throw "Shell check or delete failed (exit $($app.ExitCode))" }
          # The uninstaller runs on after the app quits
          for ($i = 0; $i -lt 90 -and (Test-Path (Join-Path $dir 'ST.exe')); $i++) { Start-Sleep 2 }
          if (Test-Path (Join-Path $dir 'ST.exe')) { throw "ST.exe was not removed" }
          if (Test-Path $data) { throw "The data folder was not removed: $data" }
          Write-Host "Delete ST-SoftwareTool: OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-${{ inputs.tag }}
          path: |
            dist_nuitka/installer/ST-SoftwareTool-Setup.exe
            build/shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach the installer to the release
        if: ${{ inputs.upload }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist_nuitka/installer/ST-SoftwareTool-Setup.exe --clobber
