name: Build macOS app (.dmg)

# Builds ST-SoftwareTool.app for Apple Silicon and Intel Macs and packs each into a .dmg.
# - push to main (app code changed) / manual run: build + test, .dmg kept as a workflow artifact
# - release published: the .dmg files are also attached to that GitHub release, where the
#   in-app updater and the website download them from
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'core/**'
      - 'ui/**'
      - 'assets/**'
      - 'packaging/macos/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: write          # attach the .dmg files to a release

concurrency:
  group: macos-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and newer)
            arch: arm64
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DMG_NAME: ST-SoftwareTool-macOS-${{ matrix.arch }}.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check build architecture
        run: |
          machine=$(python -c "import platform; print(platform.machine())")
          echo "Runner Python architecture: $machine (expected ${{ matrix.arch }})"
          test "$machine" = "${{ matrix.arch }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PySide6 6.8 LTS: Qt 6.8 still supports macOS 12+, newer Qt needs macOS 14.4+
          # (many Intel Macs can't update past macOS 13).
          # certifi: the app's HTTPS certificates (macOS Python can't use the keychain)
          python -m pip install "PySide6==6.8.*" psutil certifi nuitka ordered-set zstandard

      - name: Read app version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}  # via env, never pasted into the script
        run: |
          VERSION=$(python -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('core/updater.py', encoding='utf-8-sig').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building ST-SoftwareTool $VERSION for ${{ matrix.arch }}"
          # A release must contain its own version bump, otherwise Macs would be offered
          # the same "update" forever.
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="$RELEASE_TAG"
            if [ "v$VERSION" != "$tag" ]; then
              echo "::error::Code says $VERSION but the release tag is $tag"
              exit 1
            fi
          fi

      - name: Smoke test (source)
        run: ST_SMOKE_TEST=15 python main.py

      - name: Download Tor for macOS (signature verified)
        # The VPN tab runs the official Tor Expert Bundle, shipped inside the app
        run: bash scripts/fetch-tor-macos.sh ${{ matrix.arch }} build/tor_bundle

      - name: Download yt-dlp for macOS (checksum verified)
        run: |
          mkdir -p build/tools
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -fsSL -o build/tools/yt-dlp_macos "$base/yt-dlp_macos"
          curl -fsSL -o build/SHA2-256SUMS "$base/SHA2-256SUMS"
          expected=$(grep ' yt-dlp_macos$' build/SHA2-256SUMS | awk '{print $1}')
          actual=$(shasum -a 256 build/tools/yt-dlp_macos | awk '{print $1}')
          echo "expected $expected"; echo "actual   $actual"
          test -n "$expected" && test "$expected" = "$actual"
          chmod +x build/tools/yt-dlp_macos

      - name: Create app icon
        # Rounded macOS-style icon, made by packaging/macos/make_app_icon.py
        run: |
          src=packaging/macos/app-icon-1024.png
          mkdir -p build/ST.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "build/ST.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d "$src" --out "build/ST.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/ST.iconset -o build/ST.icns

      - name: Compile app with Nuitka
        run: |
          python -m nuitka \
            --mode=app \
            --enable-plugin=pyside6 \
            --macos-app-name="ST-SoftwareTool" \
            --macos-signed-app-name="com.stsoftwaretool.app" \
            --macos-app-version="$VERSION" \
            --macos-app-icon=build/ST.icns \
            --macos-app-protected-resource="NSAppleEventsUsageDescription:ST-SoftwareTool reads and changes your Login Items (Advanced Startup), and shows and controls what Apple Music or Spotify is playing in the Music & Audio widget." \
            --macos-app-protected-resource="NSDesktopFolderUsageDescription:ST-SoftwareTool's File Manager shows and manages the files on your Desktop." \
            --macos-app-protected-resource="NSDownloadsFolderUsageDescription:ST-SoftwareTool's File Manager shows and manages your Downloads." \
            --macos-app-protected-resource="NSRemovableVolumesUsageDescription:ST-SoftwareTool's File Manager shows the files on USB drives and memory cards." \
            --macos-app-protected-resource="NSNetworkVolumesUsageDescription:ST-SoftwareTool's File Manager shows the files on network drives." \
            --include-data-dir=assets=assets \
            --include-package-data=certifi \
            --include-data-files=build/tools/yt-dlp_macos=tools/yt-dlp_macos \
            --output-dir=build/nuitka \
            --output-filename=ST-SoftwareTool \
            --assume-yes-for-downloads \
            main.py
          app=$(ls -d build/nuitka/*.app | head -n 1)
          rm -rf "build/ST-SoftwareTool.app"
          mv "$app" "build/ST-SoftwareTool.app"
          chmod +x build/ST-SoftwareTool.app/Contents/MacOS/tools/yt-dlp_macos || true
          # Tor for the VPN tab (core/vpn_manager.py looks for Contents/MacOS/core/tor_bundle)
          mkdir -p build/ST-SoftwareTool.app/Contents/MacOS/core
          cp -R build/tor_bundle build/ST-SoftwareTool.app/Contents/MacOS/core/tor_bundle
          ls -la build/ST-SoftwareTool.app/Contents/MacOS | head -20

      - name: Set minimum macOS version
        # Read the newest "minimum macOS" any bundled binary was built for and declare it
        # in Info.plist, so older Macs get Apple's clear "requires macOS X" message
        # instead of a crash.
        run: |
          MIN_MACOS=$(python - <<'PY'
          import glob, os, struct
          def minos(path):
              if not os.path.isfile(path) or os.path.islink(path):
                  return None
              with open(path, 'rb') as f:
                  data = f.read(65536)
              if len(data) < 32 or struct.unpack('<I', data[:4])[0] != 0xFEEDFACF:
                  return None
              ncmds, off = struct.unpack('<I', data[16:20])[0], 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack('<II', data[off:off + 8])
                  if cmd == 0x32:
                      v = struct.unpack('<I', data[off + 12:off + 16])[0]
                      return (v >> 16, (v >> 8) & 0xff)
                  if cmd == 0x24:
                      v = struct.unpack('<I', data[off + 8:off + 12])[0]
                      return (v >> 16, (v >> 8) & 0xff)
                  off += size
          files = glob.glob('build/ST-SoftwareTool.app/Contents/MacOS/**/*', recursive=True)
          found = [m for m in map(minos, files) if m]
          print('%d.%d' % max(found))
          PY
          )
          echo "Minimum macOS for this build: $MIN_MACOS"
          plist=build/ST-SoftwareTool.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string $MIN_MACOS" "$plist"
          echo "MIN_MACOS=$MIN_MACOS" >> "$GITHUB_ENV"
          echo "### ${{ matrix.arch }}: requires macOS $MIN_MACOS or newer" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign app (ad-hoc)
        run: |
          # Tor's programs and libraries: sign any that aren't signed yet, so the app's seal
          # covers them (macOS refuses to run unsigned code inside a signed app)
          find build/ST-SoftwareTool.app/Contents/MacOS/core/tor_bundle -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign -v "$f" 2>/dev/null || codesign --force --sign - "$f"
            fi
          done
          codesign --force --deep --sign - build/ST-SoftwareTool.app
          codesign --verify --deep --strict --verbose=2 build/ST-SoftwareTool.app

      - name: Smoke test (packaged app)
        run: |
          bin=$(find build/ST-SoftwareTool.app/Contents/MacOS -maxdepth 1 -type f -perm -u+x -name 'ST-SoftwareTool*' | head -n 1)
          echo "bin=$bin" >> "$GITHUB_ENV"
          echo "Launching $bin"
          set -o pipefail
          ST_SMOKE_TEST=20 ST_SMOKE_SHOTS=build/app-shots ST_SMOKE_HTTPS=1 ST_SMOKE_WIDGET=1 ST_SMOKE_TOR=1 "$bin" | tee build/smoke.log
          # The VPN must use the Tor that ships inside the app, and it must run
          grep -q "SMOKE tor='.*/ST-SoftwareTool.app/Contents/MacOS/core/tor_bundle/tor/tor' version='Tor version" build/smoke.log
          # The app must recognise its own bundle (Task Manager, Open at Login, updates use it)
          grep -q "bundle='.*/ST-SoftwareTool.app'" build/smoke.log
          # HTTPS must use the certificates shipped inside the app, not a file that only exists
          # on this build machine (users' Macs got CERTIFICATE_VERIFY_FAILED)
          grep -q "SMOKE ssl cert file='.*/ST-SoftwareTool.app/.*cacert.pem'" build/smoke.log

      - name: Task Manager collector (packaged app)
        # The Task Manager runs the app binary with --proc-monitor to list processes
        run: |
          python - "$bin" <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen([sys.argv[1], '--proc-monitor'], stdout=subprocess.PIPE)
          try:
              procs = json.loads(p.stdout.readline())
          finally:
              p.terminate()
          with_ram = sum(1 for x in procs if x['ram_mb'] > 0)
          print(f'{len(procs)} processes, {with_ram} with memory figures')
          assert len(procs) > 100 and with_ram >= 0.95 * len(procs)
          PY
          /usr/libexec/PlistBuddy -c "Print :NSAppleEventsUsageDescription" build/ST-SoftwareTool.app/Contents/Info.plist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-tab-screenshots-${{ matrix.arch }}
          path: build/app-shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: App icon (dark custom icon, relaunch, back to light)
        # Settings › App Icon sets the dark logo as the app's custom icon. Check it is set, that
        # the app still starts with it, and that Light removes it again — on a copy, so the
        # .dmg gets the untouched app.
        run: |
          rm -rf /tmp/ST-icon-test.app
          cp -R build/ST-SoftwareTool.app /tmp/ST-icon-test.app
          bin=/tmp/ST-icon-test.app/Contents/MacOS/ST-SoftwareTool
          mkdir -p build/icon-shots
          set -o pipefail
          ST_SMOKE_TEST=6 ST_SMOKE_ICON=dark ST_SMOKE_ICON_SHOT=build/icon-shots/dock-dark.png "$bin" | tee build/icon1.log
          grep -q "SMOKE app icon choice='dark' style='dark' bundle_custom_icon=True" build/icon1.log
          ls -la@ /tmp/ST-icon-test.app
          ST_SMOKE_TEST=6 "$bin" | tee build/icon2.log          # starts fine with the custom icon
          ST_SMOKE_TEST=6 ST_SMOKE_ICON=light ST_SMOKE_ICON_SHOT=build/icon-shots/dock-light.png "$bin" | tee build/icon3.log
          grep -q "SMOKE app icon choice='light' style='light' bundle_custom_icon=False" build/icon3.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-icon-screenshots-${{ matrix.arch }}
          path: build/icon-shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build .dmg (custom install window)
        # Window design: packaging/macos/make_dmg_background.py (background) and
        # packaging/macos/dmg_settings.py (size, icon positions).
        run: |
          # the tests above must not have changed the app that goes into the .dmg
          codesign --verify --deep --strict build/ST-SoftwareTool.app
          python -m pip install "dmgbuild>=1.6"
          tiffutil -cathidpicheck packaging/macos/dmg-background.png \
            packaging/macos/dmg-background@2x.png -out build/dmg-background.tiff
          dmgbuild -s packaging/macos/dmg_settings.py \
            -D app=build/ST-SoftwareTool.app \
            -D background=build/dmg-background.tiff \
            -D icon=build/ST.icns \
            "ST-SoftwareTool" "build/$DMG_NAME"
          hdiutil verify "build/$DMG_NAME"
          ls -lh "build/$DMG_NAME"

      - name: Terminal shell, then Settings › Delete ST-SoftwareTool (on a copy)
        # Runs after the .dmg is built, on a copy, so the shipped app is untouched
        run: |
          copy="$RUNNER_TEMP/delete-test/ST-SoftwareTool.app"
          mkdir -p "$(dirname "$copy")"
          ditto build/ST-SoftwareTool.app "$copy"
          data="$HOME/Library/Application Support/ST-SoftwareTool"
          cbin="$copy/Contents/MacOS/$(basename "$bin")"
          set -o pipefail
          ST_SMOKE_TEST=8 ST_SMOKE_SHELL=1 ST_SMOKE_UNINSTALL=1 "$cbin" | tee build/delete.log
          grep -q "SMOKE shell=.* ok=True" build/delete.log
          grep -q "SMOKE uninstall: starting" build/delete.log
          test ! -e "$copy"            || { echo "app was not removed"; exit 1; }
          ls -d "$HOME/.Trash/ST-SoftwareTool"*.app   # it went to the Trash
          test ! -e "$data"            || { echo "data folder was not removed"; exit 1; }
          test ! -e "$HOME/Library/LaunchAgents/com.stsoftwaretool.app.plist"
          echo "Delete ST-SoftwareTool: OK"

      - name: Screenshot the install window (light + dark mode)
        continue-on-error: true
        run: |
          mkdir -p build/screens
          hdiutil attach "build/$DMG_NAME" -noautoopen
          vol=/Volumes/ST-SoftwareTool
          ls -la "$vol"
          shoot() {
            osascript -e 'tell application "Finder" to close every window' || true
            open "$vol"
            sleep 6
            osascript -e 'tell application "Finder" to get bounds of front window' || true
            screencapture -x "build/screens/install-window-$1.png"
          }
          shoot light
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' && shoot dark
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
          osascript -e 'tell application "Finder" to close every window' || true
          hdiutil detach "$vol" || hdiutil detach -force "$vol"

      - uses: actions/upload-artifact@v4
        with:
          name: install-window-screenshots-${{ matrix.arch }}
          path: build/screens/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: build/${{ env.DMG_NAME }}
          retention-days: 14

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "build/$DMG_NAME" --clobber
