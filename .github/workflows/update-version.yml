name: Auto-update website version

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in index.html
        env:
          VERSION: ${{ github.event.release.tag_name }}  # via env, never pasted into the script
        run: |
          # The tag ends up in the website's HTML, so only accept plain versions like v1.0.23
          if ! [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Release tag '$VERSION' is not a plain version like v1.0.23"
            exit 1
          fi
          # Replace content of every .gh-version span
          sed -i 's|<span class="gh-version">[^<]*</span>|<span class="gh-version">'"$VERSION"'</span>|g' index.html
          echo "Updated index.html to $VERSION"
          grep 'gh-version' index.html | head -3

      - name: Commit and push
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit (version already up to date)"
          else
            git commit -m "chore: bump website version to $VERSION"
            git push origin main
          fi
